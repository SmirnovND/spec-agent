services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gobase
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: developer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d gobase"]
      interval: 10s
      timeout: 5s
      retries: 10

  runner:
    build:
      context: ../../..
      dockerfile: eval/openai/shortener/Dockerfile.runner
    environment:
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5-codex}
      REPO_ROOT: /work
      SOURCE_FIXTURE: /work/eval/fixtures/draft/repo
      RUN_ROOT: /tmp/spec-agent-openai-run
      EXPORT_DIR: /out
      DB_HOST: postgres
      APP_HOST: http://localhost:8080
    volumes:
      - ../../..:/work:ro
      - ../../../eval/results/openai-shortener:/out
      - ${HOME}/.codex:/root/.codex
    depends_on:
      postgres:
        condition: service_healthy
