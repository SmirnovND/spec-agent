checkpoints:
  - id: init_prompts_created
    type: file_exists
    path: .spec_agent/prompts/entrypoint.md
  - id: router_spec_created
    type: file_contains
    path: internal/router/router.md
    pattern: "<!-- SPEC:FILE=true -->"
  - id: router_spec_has_links
    type: file_contains
    path: internal/router/router.md
    pattern: "## Links"
  - id: write_spec_changes
    type: glob_exists
    path: spec_changes/*bootstrap*.md
