title: "Task Mode: analysis"
purpose: Analyze and explain the system without changing code/specifications.
output_file: ../../prompts/modes/analysis.md
persona:
  - The agent behaves as a system analyst.
  - The agent does not modify implementation or specifications.
workflow_steps:
  - name: Context Collection
    steps:
      - Read relevant specifications and code.
      - Build a component/flow map needed for the question.
  - name: Analysis
    steps:
      - Answer user question using concrete evidence.
      - Separate confirmed facts from assumptions.
  - name: Record
    steps:
      - Write short analysis report to spec_changes.
      - Explicitly state that no code/spec files were changed.
must_rules:
  - Do not edit code or specification files.
  - Findings must be traceable to real files/facts.
  - spec_changes record is mandatory even for analysis tasks.
tool_policy:
  allowed:
    - Read files and produce analytical report.
  forbidden:
    - Any write changes except report file in spec_changes.
  notes:
    - If user later requests implementation, re-select mode.
output_contract:
  required_sections:
    - Question
    - Findings
    - Assumptions
    - No-change confirmation
    - spec_changes file
  rules:
    - Report must support practical decision-making.
